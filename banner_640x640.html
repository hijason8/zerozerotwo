<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 640px;
      height: 640px;
      overflow: hidden;
      background-color: #FAF9F6;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 15% 85%, rgba(20, 184, 166, 0.08) 0%, transparent 55%),
        linear-gradient(to bottom, #FFFFFF 0%, #FAF9F6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Inter", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 背景微妙網格 */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      pointer-events: none;
    }

    /* 幾何微裝飾 */
    .deco-circle {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 1.5px dashed rgba(16, 185, 129, 0.18);
      pointer-events: none;
    }

    /* 正方形立體卡片容器 */
    .brand-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
    }

    /* 獎杯 Logo 圖標卡片 */
    .logo-box {
      width: 140px;
      height: 140px;
      border-radius: 38px;
      background: #FFFFFF;
      border: 2.5px solid rgba(16, 185, 129, 0.25);
      box-shadow: 
        0 20px 35px -10px rgba(16, 185, 129, 0.18),
        0 10px 15px -3px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box svg {
      width: 80px;
      height: 80px;
    }

    /* 品牌大標題 */
    .title-row {
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    .brand-zero {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #1C1917; /* 曜石深黑 */
    }

    .brand-two {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-left: 2px;
    }

    /* 精緻標籤徽章 */
    .sub-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 9999px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .sub-text {
      font-size: 15px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.5px;
    }

    .domain-tag {
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 800;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 7px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="deco-circle"></div>

  <div class="brand-container">
    <!-- 獎杯 Logo 圖標 -->
    <div class="logo-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
        <path d="M4 22h16" />
        <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34" />
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" fill="#10b981" fill-opacity="0.15" />
      </svg>
    </div>

    <!-- 品牌標題 -->
    <div class="title-row">
      <span class="brand-zero">ZeroZero</span><span class="brand-two">Two</span>
    </div>

    <!-- 品牌標籤 -->
    <div class="sub-badge">
      <span class="status-dot"></span>
      <span class="sub-text">匹克球社團排賽計分系統</span>
      <span class="domain-tag">zztwo.com</span>
    </div>
  </div>
</body>
</html>
