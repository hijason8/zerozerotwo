name: Gemini CLI Dispatch

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  gemini-cli:
    # 僅在主分支被標記 @gemini-cli 且留言者為倉庫擁有者或協作者時觸發
    if: |
      contains(github.event.issue.body || github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          settings: |
            {
              "general": {
                "previewFeatures": true
              },
              "model": {
                "name": "gemini-3.8-flash"
              }
            }
