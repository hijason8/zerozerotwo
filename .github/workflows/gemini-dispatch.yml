name: Gemini CLI Dispatch

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  gemini-cli:
    if: |
      contains(github.event.issue.body || github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            請處理以下 GitHub 任務並建立 Pull Request（不要直接推送到 main 分支）：
            標題：${{ github.event.issue.title }}
            內容：${{ github.event.comment.body || github.event.issue.body }}
          settings: |
            {
              "model": {
                "name": "gemini-2.5-flash"
              }
            }
