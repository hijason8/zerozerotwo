# 每次有 PR 時，自動把修改後的網頁放到 Firebase 臨時預覽網址（7 天後自動失效）
# 不會影響正式網站 zztwo.com
name: PR 預覽網址

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PICKLEBALL_HUB_D0AB1 }}
          projectId: pickleball-hub-d0ab1
          expires: 7d
