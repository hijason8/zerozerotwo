<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 640px;
      height: 640px;
      overflow: hidden;
      background-color: #FAF9F6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Inter", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    .brand-zero {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #1C1917; /* 曜石深黑 */
    }

    .brand-two {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #10B981; /* 翡翠綠 */
      padding-left: 2px;
    }
  </style>
</head>
<body>
  <div class="title-row">
    <span class="brand-zero">ZeroZero</span><span class="brand-two">Two</span>
  </div>
</body>
</html>
